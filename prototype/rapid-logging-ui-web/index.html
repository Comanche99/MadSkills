<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — BuJo web UI, vibe variants (throwaway, do not ship)</title>
<style>
/*
  NOTE (feedback point 6, not prototyped): the real implementation should keep the design
  system (colors, type, spacing, chrome) separate from the app's logic/markup so multiple
  skins can be swapped without touching component code. This file fakes that separation with
  a small set of CSS custom properties per [data-theme] — a real build would want a proper
  token layer (e.g. CSS variables generated from a design-tokens file, or a themed component
  library) rather than variables hand-picked per prototype.
*/

/* ---- shared tokens (structural, theme-agnostic) ---- */
:root{
  --radius:12px; --radius-sm:7px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding-bottom:70px;background:var(--bg);color:var(--ink)}

/* ---- theme: Paper (warm parchment) — default ---- */
:root, [data-theme="paper"]{
  --bg:#f2e9d8; --panel:#fffaf0; --ink:#3a2f22; --ink-dim:#8a7960; --line:#e8dcc0;
  --accent:#a5652f; --task-done:#a5652f; --task-cancel:#c4b39a; --event:#4a7a8c; --note:#8a7960;
  --danger:#a3402f; --ok:#4a7a4a;
  --heading-font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
}
[data-theme="paper"] body{background-image:radial-gradient(#e4d6b8 0.6px, transparent 0.6px);background-size:14px 14px}
[data-theme="paper"] .card{box-shadow:0 2px 0 var(--line)}

/* ---- theme: Ink (ruled notebook, monochrome + one ink accent) ---- */
[data-theme="ink"]{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#1c1c1c; --ink-dim:#7a7a7a; --line:#dedede;
  --accent:#7a2e2e; --task-done:#7a2e2e; --task-cancel:#b8b0a8; --event:#3a3a5c; --note:#5a5650;
  --danger:#7a2e2e; --ok:#2e5a3a;
  --heading-font: Georgia, "Times New Roman", serif;
}
[data-theme="ink"] .col.center{background-image:repeating-linear-gradient(var(--panel) 0 27px, var(--line) 27px 28px)}
[data-theme="ink"] .card{border-radius:2px}
[data-theme="ink"] .btn{border-radius:2px}

/* ---- theme: Washi (cozy pastel scrapbook) ---- */
[data-theme="washi"]{
  --bg:#faf1e6; --panel:#fffdf9; --ink:#4a3b32; --ink-dim:#a08b74; --line:#f0ddc0;
  --accent:#c2694f; --task-done:#c2694f; --task-cancel:#d8c4ac; --event:#6a8f7a; --note:#a08b74;
  --danger:#c2694f; --ok:#6a8f5a;
  --heading-font: Georgia, "Segoe Print", "Bradley Hand", cursive, serif;
}
[data-theme="washi"] .washi-tape{position:relative;display:inline-block;padding:2px 14px;
     background:linear-gradient(100deg,#e9c9a6,#f0dcc0);color:#5a4632;transform:rotate(-1deg);
     border-radius:2px;box-shadow:1px 1px 3px rgba(0,0,0,.12);font-size:11px;letter-spacing:.03em}
[data-theme="washi"] .card{border-radius:16px}
[data-theme="washi"] input[type=checkbox]{border-radius:4px}

h1,h2,h3{margin:0;font-family:var(--heading-font)}
.note-banner{font-size:12px;color:#7a1f1f;background:#fce7e0;border-bottom:1px solid #eab3a0;padding:8px 20px}
.btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:6px}
.btn.danger{background:var(--danger)} .btn.ok{background:var(--ok)}
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.bullet-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.bullet-row:last-child{border-bottom:none}
.glyph{width:16px;flex:none;text-align:center;font-size:14px;color:var(--ink);cursor:pointer;border-radius:4px}
.glyph:hover{background:color-mix(in srgb, var(--accent) 20%, transparent)}
.glyph.event{color:var(--event)} .glyph.note{color:var(--note)}
.glyph.done{color:var(--task-done)} .glyph.cancel{color:var(--task-cancel)}
.btxt{flex:1;font-size:14px} .btxt.done{color:var(--ink-dim);text-decoration:line-through}
.btxt.cancel{color:var(--task-cancel);text-decoration:line-through}
.tag{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:1px 6px;margin-left:6px;white-space:nowrap;display:inline-block}
.empty{font-size:13px;color:var(--ink-dim);font-style:italic}
input[type=text],input[type=date]{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);
     font-size:13px;background:var(--panel);color:var(--ink)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}

/* inline "always an empty row" composer, subtle type picker that appears on focus */
.bullet-row.compose{align-items:center;cursor:text}
.bullet-row.compose .type-toggle{display:flex;gap:2px;flex:none;opacity:.3;transition:opacity .15s}
.bullet-row.compose:focus-within .type-toggle{opacity:1}
.bullet-row.compose .type-toggle button{width:17px;height:17px;border:none;background:none;cursor:pointer;
     font-size:13px;color:var(--ink-dim);border-radius:4px;padding:0;line-height:1}
.bullet-row.compose .type-toggle button.active{color:var(--accent);background:color-mix(in srgb, var(--accent) 18%, transparent)}
.bullet-row.compose input{flex:1;border:none;background:none;outline:none;font-size:14px;color:var(--ink);
     padding:2px 0;font-family:inherit}
.bullet-row.compose input::placeholder{color:var(--ink-dim);opacity:.6}

/* switcher */
#switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;
     display:flex;align-items:center;gap:10px;background:#1c1a16;color:#fff;padding:8px 8px 8px 14px;
     border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px}
#switcher button{background:#332f27;color:#fff;border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
#switcher .lbl{min-width:170px;text-align:center}
#switcher .lbl b{display:block;font-size:9px;letter-spacing:.08em;color:#c9a97e;text-transform:uppercase}

/* ---- layout: multi-pane dashboard (the winning IA) ---- */
.shell{display:grid;grid-template-columns:300px 1fr 300px;gap:0;min-height:calc(100vh - 34px)}
.col{padding:20px;overflow:auto}
.col + .col{border-left:1px solid var(--line)}
.col h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-dim);margin-bottom:10px}

/* day-nav panel with inline habit tracker */
.daynav{width:100%;border-collapse:collapse;font-size:12.5px}
.daynav th,.daynav td{padding:4px 3px;border-bottom:1px solid var(--line)}
.daynav th{font-size:9px;color:var(--ink-dim);font-weight:600;vertical-align:bottom}
.daynav tr.week-end td,.daynav tr.week-end th{border-bottom:2px solid var(--accent)}
.daynav tr.today td{background:color-mix(in srgb, var(--accent) 12%, transparent)}
.daynav td.daylabel{width:56px;font-weight:700;cursor:pointer;white-space:nowrap}
.daynav td.daylabel .dow{display:inline-block;width:28px;color:var(--ink-dim);font-weight:600;font-size:11px}
.daynav td.daylabel .dnum{display:inline-block;width:16px;text-align:left;font-variant-numeric:tabular-nums}
.daynav td.dots{cursor:pointer}
.daynav td.dots .dotrow{display:flex;gap:2px}
.daynav td.dots .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.daynav th.habitcol,.daynav td.habitcol{width:22px;text-align:center;padding:2px}
.daynav th.habitcol .vert{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;
     white-space:nowrap;color:var(--accent);font-weight:700;max-height:70px;display:inline-block}

.need-review{background:color-mix(in srgb, var(--danger) 8%, var(--panel));border:1px solid color-mix(in srgb, var(--danger) 30%, var(--line));
     border-radius:var(--radius-sm);padding:10px 12px;margin-top:16px}
.need-review .r{display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px}
.need-review .r:last-child{border-bottom:none}
.need-review .r .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need-review .r .btn.small{padding:3px 7px;font-size:10px;flex:none}

.habit-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.habit-picker button{padding:2px 9px;font-size:10.5px;border-radius:12px;border:1px solid var(--line);
     background:var(--panel);color:var(--ink-dim);cursor:pointer}
.habit-picker button.on{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 16%, var(--panel));
     color:var(--ink);font-weight:600}

.habit-table{width:100%;border-collapse:collapse;font-size:11px}
.habit-table th,.habit-table td{border:1px solid var(--line);padding:3px 2px;text-align:center}
.habit-table th{background:var(--panel);font-size:9px}
.habit-table td.name{text-align:left;padding-left:5px;font-weight:600}
</style>
</head>
<body>
<div class="note-banner">PROTOTYPE — throwaway, not production code. Refines Variant B (winner) for wayfinder ticket #11: habit tracker moved into the day-nav panel, letter-only day labels, week dividers, dot-matched checkbox color — plus three "journal vibe" skins to react to. In-memory data only, resets on reload.</div>
<div id="app"></div>
<div id="switcher"></div>

<script>
/* ---------- fixed "today" ---------- */
const TODAY = new Date(2026,7,22);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const TODAY_ISO = iso(TODAY);
const TODAY_MONTH = monthKey(TODAY);
const dayName = iso => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
const humanDate = iso => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const humanMonth = mk => { const [y,m]=mk.split('-'); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); };
const prevMonthKey = mk => { const [y,m]=mk.split('-').map(Number); return monthKey(new Date(y,m-2,1)); };
const nextMonthKey = mk => { const [y,m]=mk.split('-').map(Number); return monthKey(new Date(y,m,1)); };
const daysInMonth = mk => { const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); };

/* ---------- seed data ---------- */
let uid = 100;
const data = {
  habits: [
    {id:'h1', name:'Exercise', archived:false},
    {id:'h2', name:'Read', archived:false},
    {id:'h3', name:'Meditate', archived:false},
    {id:'h4', name:'Journal', archived:false},
    {id:'h5', name:'Stretch', archived:false},
    {id:'h6', name:'Water', archived:false},
  ],
  monthlyHabitSelection: { '2026-07':['h1','h2'], '2026-08':['h1','h2','h3','h4'] },
  habitChecks: {},
  bullets: [
    {id:'b1',type:'task',text:'Finish wayfinder prototype ticket',scope:'day',date:'2026-08-22',status:'open',history:[]},
    {id:'b2',type:'event',text:'Team standup 10am',scope:'day',date:'2026-08-22'},
    {id:'b3',type:'note',text:'Idea: weekly review ritual on Sundays',scope:'day',date:'2026-08-22'},
    {id:'b4',type:'task',text:'Buy groceries',scope:'day',date:'2026-08-20',status:'complete',history:[]},
    {id:'b5',type:'task',text:'Call dentist',scope:'day',date:'2026-08-20',status:'open',history:[]},
    {id:'b6',type:'task',text:'Renew passport',scope:'day',date:'2026-07-10',status:'open',history:[]},
    {id:'b7',type:'task',text:'Fix leaky faucet',scope:'day',date:'2026-07-18',status:'open',history:[]},
    {id:'b8',type:'task',text:'Write blog post draft',scope:'day',date:'2026-07-25',status:'open',
      history:[{from:'2026-06',to:'2026-07',timestamp:'2026-07-01T09:00:00Z'}]},
    {id:'b9',type:'event',text:"Mom's birthday",scope:'month',month:'2026-08',dayAnchor:'2026-08-28'},
    {id:'b10',type:'task',text:'Quarterly taxes due',scope:'month',month:'2026-08',dayAnchor:'2026-08-31',status:'open',history:[]},
    {id:'b11',type:'task',text:'Plan autumn trip',scope:'month',month:'2026-08',dayAnchor:null,status:'open',history:[]},
    {id:'b12',type:'task',text:'Research new laptop',scope:'month',month:'2026-08',dayAnchor:null,status:'open',history:[]},
    {id:'b13',type:'task',text:'Organize garage',scope:'month',month:'2026-07',dayAnchor:null,status:'open',history:[]},
  ],
};
['2026-08-18','2026-08-19','2026-08-20','2026-08-21'].forEach(d=>data.habitChecks[`h1_${d}`]=true);
['2026-08-19','2026-08-21'].forEach(d=>data.habitChecks[`h2_${d}`]=true);
['2026-08-20'].forEach(d=>data.habitChecks[`h3_${d}`]=true);
['2026-08-19','2026-08-20'].forEach(d=>data.habitChecks[`h4_${d}`]=true);

/* ---------- shared helpers ---------- */
function bulletsForDay(dateIso){
  return data.bullets.filter(b => (b.scope==='day' && b.date===dateIso) || (b.scope==='month' && b.dayAnchor===dateIso))
    .sort((a,b)=> (a.scope==='month'?0:1) - (b.scope==='month'?0:1));
}
function monthUnanchored(mk){ return data.bullets.filter(b=>b.scope==='month' && b.month===mk && !b.dayAnchor); }
function openTasksForMonthBoundary(mk){
  return data.bullets.filter(b => b.type==='task' && b.status==='open' &&
    ((b.scope==='day' && b.date.startsWith(mk)) || (b.scope==='month' && b.month===mk)));
}
function glyphParts(b){
  if(b.type==='event') return ['○','event'];
  if(b.type==='note') return ['–','note'];
  if(b.status==='complete') return ['✕','done'];
  if(b.status==='cancelled') return ['⦸','cancel'];
  return ['•',''];
}
function glyph(b){ const [s,c]=glyphParts(b); return `<span class="glyph ${c}">${s}</span>`; }
function bulletRow(b){
  const [sym,cls] = glyphParts(b);
  const txtClass = b.status==='complete' ? 'done' : b.status==='cancelled' ? 'cancel' : '';
  const tag = b.scope==='month' ? `<span class="tag">${b.dayAnchor ? 'this month' : 'month list'}</span>` : '';
  const toggler = (b.type==='task' && b.status!=='cancelled') ? `onclick="toggleTaskDone('${b.id}')" style="cursor:pointer"` : '';
  const glyphEl = `<span class="glyph ${cls}" onclick="event.stopPropagation();cycleBulletType('${b.id}')" title="Click to change bullet type">${sym}</span>`;
  return `<div class="bullet-row" ${toggler}>${glyphEl}<span class="btxt ${txtClass}">${b.text}${tag}</span></div>`;
}
function cycleBulletType(id){
  const b = data.bullets.find(x=>x.id===id);
  const order = ['task','event','note'];
  b.type = order[(order.indexOf(b.type)+1)%order.length];
  if(b.type==='task'){ if(!b.status) b.status='open'; if(!b.history) b.history=[]; }
  else { delete b.status; delete b.history; }
  render();
}
function migrateTask(id, toMonth){
  const b = data.bullets.find(x=>x.id===id);
  const from = b.scope==='day' ? monthKey(new Date(b.date+'T00:00:00')) : b.month;
  b.history.push({from, to:toMonth, timestamp:new Date().toISOString()});
  b.scope='month'; b.month=toMonth; b.dayAnchor=null;
  render();
}
function cancelTask(id){ const b=data.bullets.find(x=>x.id===id); b.status='cancelled'; render(); }
function completeTaskById(id){ const b=data.bullets.find(x=>x.id===id); if(b.status==='open'){ b.status='complete'; render(); } }
function toggleTaskDone(id){
  const b = data.bullets.find(x=>x.id===id);
  b.status = b.status==='open' ? 'complete' : 'open';
  render();
}
function toggleHabit(mk, habitId){
  const sel = data.monthlyHabitSelection[mk] || (data.monthlyHabitSelection[mk]=[]);
  const i = sel.indexOf(habitId);
  if(i>=0) sel.splice(i,1); else sel.push(habitId);
  render();
}
function toggleHabitCheck(habitId, dateIso){
  data.habitChecks[`${habitId}_${dateIso}`] = !data.habitChecks[`${habitId}_${dateIso}`];
  render();
}
function addBullet({type,text,scope,date,month,dayAnchor}){
  if(!text || !text.trim()) return;
  uid++;
  data.bullets.push({
    id:'b'+uid, type, text:text.trim(), scope,
    date: scope==='day' ? date : undefined,
    month: scope==='month' ? month : undefined,
    dayAnchor: scope==='month' ? (dayAnchor||null) : undefined,
    status: type==='task' ? 'open' : undefined,
    history: type==='task' ? [] : undefined,
  });
  render();
}
function habitPickerHTML(mk){
  const sel = data.monthlyHabitSelection[mk] || [];
  const chips = data.habits.filter(h=>!h.archived).map(h=>{
    const on = sel.includes(h.id);
    return `<button class="${on?'on':''}" onclick="toggleHabit('${mk}','${h.id}')">${on?'✓ ':''}${h.name}</button>`;
  }).join('');
  return `<div class="habit-picker">${chips}</div>`;
}

/* ---------- ui state ---------- */
const ui = { selectedDate: TODAY_ISO, activeMonth: TODAY_MONTH, composeDayType:'task', composeMonthType:'task' };

/* ================= the winning layout: multi-pane dashboard, habit tracker in the day-nav panel ================= */
function renderDayNav(mk){
  const nDays = daysInMonth(mk); const [y,m] = mk.split('-').map(Number);
  const sel = data.monthlyHabitSelection[mk] || [];
  const habits = data.habits.filter(h=>!h.archived && sel.includes(h.id));
  const head = `<tr><th></th><th></th>${habits.map(h=>`<th class="habitcol"><span class="vert">${h.name}</span></th>`).join('')}</tr>`;
  const rows = Array.from({length:nDays},(_,i)=>{
    const d = `${y}-${pad(m)}-${pad(i+1)}`;
    const weekdayAbbr = dayName(d);
    const dow = new Date(d+'T00:00:00').getDay();
    const n = bulletsForDay(d).length;
    const habitCells = habits.map(h=>{
      const checked = !!data.habitChecks[`${h.id}_${d}`];
      return `<td class="habitcol"><input type="checkbox" ${checked?'checked':''} onchange="toggleHabitCheck('${h.id}','${d}')"></td>`;
    }).join('');
    const cls = [d===TODAY_ISO?'today':'', dow===0?'week-end':''].filter(Boolean).join(' ');
    return `<tr${cls?` class="${cls}"`:''}>
      <td class="daylabel" onclick="ui.selectedDate='${d}';render()"><span class="dow">${weekdayAbbr}</span><span class="dnum">${i+1}</span></td>
      <td class="dots" onclick="ui.selectedDate='${d}';render()"><span class="dotrow">${Array.from({length:Math.min(n,4)},()=>'<span class="dot"></span>').join('')}</span></td>
      ${habitCells}
    </tr>`;
  }).join('');
  return `<table class="daynav">${head}${rows}</table>${habitPickerHTML(mk)}`;
}
function renderApp(){
  const mk = ui.activeMonth;
  const migCandidates = openTasksForMonthBoundary(prevMonthKey(TODAY_MONTH)).filter(b=>b.status==='open');
  const theme = currentVariant();
  const tapeOpen = theme==='washi' ? '<span class="washi-tape">this month</span> ' : '';
  return `
    <div class="shell">
      <div class="col">
        <h3>${tapeOpen}${humanMonth(mk)}</h3>
        <div class="row-gap" style="margin-bottom:8px">
          <button class="btn small ghost" onclick="ui.activeMonth=prevMonthKey(ui.activeMonth);render()">←</button>
          <button class="btn small ghost" onclick="ui.activeMonth=nextMonthKey(ui.activeMonth);render()">→</button>
        </div>
        ${renderDayNav(mk)}
        ${migCandidates.length ? `<div class="need-review">
          <b style="font-size:11px">Needs review (${migCandidates.length})</b>
          ${migCandidates.map(b=>`<div class="r">
              <span class="txt">${glyph(b)} ${b.text}</span>
              <button class="btn small" onclick="migrateTask('${b.id}','${TODAY_MONTH}')">Migrate</button>
              <button class="btn small ok" onclick="completeTaskById('${b.id}')">✓</button>
              <button class="btn small danger" onclick="cancelTask('${b.id}')">✕</button>
            </div>`).join('')}
        </div>` : ''}
      </div>
      <div class="col center">
        <h3>${theme==='washi' ? '<span class="washi-tape">today</span> ' : ''}${humanDate(ui.selectedDate)}</h3>
        <div class="card" style="padding:12px 16px;margin-top:12px">
          ${bulletsForDay(ui.selectedDate).map(bulletRow).join('')}
          ${composeRow('day')}
        </div>
      </div>
      <div class="col">
        <h3>${theme==='washi' ? '<span class="washi-tape">task list</span>' : 'Month task list'}</h3>
        <div class="card" style="padding:10px 14px;margin-top:12px">
          ${monthUnanchored(mk).map(bulletRow).join('')}
          ${composeRow('month')}
        </div>
      </div>
    </div>`;
}
function composeRow(which){
  const type = which==='day' ? ui.composeDayType : ui.composeMonthType;
  const icons = [['task','•'],['event','○'],['note','–']].map(([t,sym])=>
    `<button onmousedown="event.preventDefault()" onclick="pickComposeType('${which}','${t}')"
       class="${type===t?'active':''}" title="${t[0].toUpperCase()+t.slice(1)}">${sym}</button>`
  ).join('');
  const placeholder = which==='day' ? 'Type to add a bullet…' : 'Type to add to this month…';
  return `<div class="bullet-row compose">
    <span class="type-toggle">${icons}</span>
    <input type="text" id="compose-${which}" placeholder="${placeholder}" onkeydown="composeKeydown(event,'${which}')">
  </div>`;
}
function pickComposeType(which, type){
  if(which==='day') ui.composeDayType = type; else ui.composeMonthType = type;
  render();
  focusCompose(which);
}
function focusCompose(which){
  const el = document.getElementById(`compose-${which}`);
  if(el) el.focus();
}
function composeKeydown(e, which){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const text = e.target.value;
  if(!text.trim()) return;
  if(which==='day'){
    addBullet({type: ui.composeDayType, text, scope:'day', date: ui.selectedDate});
  } else {
    addBullet({type: ui.composeMonthType, text, scope:'month', month: ui.activeMonth, dayAnchor:null});
  }
  focusCompose(which);
}

/* ---------- switcher / router (now cycles visual "vibe" themes, not IA) ---------- */
const VARIANTS = {
  paper: {name:'Paper (warm parchment)'},
  ink:   {name:'Ink (ruled notebook)'},
  washi: {name:'Washi (cozy scrapbook)'},
};
const ORDER = ['paper','ink','washi'];
function currentVariant(){
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS[v] ? v : 'paper';
}
function setVariant(v){
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null,'',url);
  render();
}
function cycle(dir){
  const cur = currentVariant();
  const i = ORDER.indexOf(cur);
  setVariant(ORDER[(i+dir+ORDER.length)%ORDER.length]);
}
function renderSwitcher(){
  const cur = currentVariant();
  document.getElementById('switcher').innerHTML = `
    <button onclick="cycle(-1)">←</button>
    <span class="lbl"><b>Vibe</b>${cur} — ${VARIANTS[cur].name}</span>
    <button onclick="cycle(1)">→</button>`;
}
document.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
function render(){
  document.body.setAttribute('data-theme', currentVariant());
  document.getElementById('app').innerHTML = renderApp();
  renderSwitcher();
}
render();
</script>
