<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — BuJo rapid logging (throwaway, do not ship)</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --ink:#232019; --ink-dim:#6b665c;
    --line:#e4ddce; --accent:#8a5a3a; --accent-ink:#fff;
    --task-open:#232019; --task-done:#8a5a3a; --task-cancel:#b3ac9c;
    --event:#3a6b8a; --note:#6b665c; --danger:#a3402f; --ok:#3a7a4a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#d9d3c4;color:var(--ink);min-height:100vh;
       display:flex;flex-direction:column;align-items:center;padding:24px 12px 100px}
  .note-banner{max-width:430px;width:100%;font-size:12px;color:#7a1f1f;background:#fce7e0;
       border:1px solid #eab3a0;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .phone{width:100%;max-width:430px;background:var(--panel);border-radius:22px;
       box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid var(--line);
       overflow:hidden;min-height:720px;display:flex;flex-direction:column;position:relative}
  .screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  header.top{padding:16px 16px 10px;border-bottom:1px solid var(--line);background:var(--panel);
       position:sticky;top:0;z-index:2}
  h1.pagetitle{font-size:19px;margin:0 0 2px;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--ink-dim)}
  .section{padding:14px 16px}
  .section h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
       color:var(--ink-dim);margin:0 0 8px}
  .bullet-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;
       border-bottom:1px solid #f0ece2}
  .bullet-row:last-child{border-bottom:none}
  .glyph{width:18px;flex:none;text-align:center;font-size:15px;line-height:1.5;color:var(--task-open)}
  .glyph.event{color:var(--event)} .glyph.note{color:var(--note)}
  .glyph.done{color:var(--task-done)} .glyph.cancel{color:var(--task-cancel)}
  .btxt{flex:1;font-size:14.5px;line-height:1.5}
  .btxt.done{color:var(--ink-dim);text-decoration:line-through}
  .btxt.cancel{color:var(--task-cancel);text-decoration:line-through}
  .tag{font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:20px;
       padding:1px 6px;margin-left:6px;white-space:nowrap}
  .empty{font-size:13px;color:var(--ink-dim);font-style:italic;padding:6px 0}
  .btn{border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;
       cursor:pointer;background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.small{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn.danger{background:var(--danger)}
  .btn.ok{background:var(--ok)}
  .row-gap{display:flex;gap:8px;flex-wrap:wrap}
  .fab{position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;
       background:var(--accent);color:#fff;font-size:26px;border:none;box-shadow:0 6px 16px rgba(0,0,0,.25);
       cursor:pointer;z-index:5}
  .sheet{position:absolute;inset:0;background:rgba(20,16,10,.42);display:flex;align-items:flex-end;z-index:10}
  .sheet .card{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:18px 16px 22px;
       max-height:80%;overflow-y:auto}
  .sheet.center{align-items:center;justify-content:center}
  .sheet.center .card{border-radius:16px;max-width:340px;margin:0 16px}
  .type-pick{display:flex;gap:8px;margin:10px 0}
  .type-pick button{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line);
       background:#faf8f2;font-size:13px;cursor:pointer}
  .type-pick button.active{border-color:var(--accent);background:#f3e6da;font-weight:700}
  input[type=text], input[type=date]{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);
       font-size:14px;margin-top:8px}
  .tabbar{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabbar button{flex:1;padding:10px 4px;background:none;border:none;font-size:13px;font-weight:600;
       color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent}
  .tabbar button.active{color:var(--accent);border-color:var(--accent)}
  .datestrip{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);
       background:var(--panel)}
  .datestrip .d{flex:none;width:44px;text-align:center;padding:8px 0;border-radius:10px;cursor:pointer;
       font-size:12px;color:var(--ink-dim)}
  .datestrip .d .n{font-size:15px;font-weight:700;color:var(--ink)}
  .datestrip .d.active{background:var(--accent);color:#fff}
  .datestrip .d.active .n{color:#fff}
  .bottomnav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
  .bottomnav button{flex:1;padding:10px 4px 8px;background:none;border:none;font-size:11px;
       color:var(--ink-dim);cursor:pointer;position:relative}
  .bottomnav button.active{color:var(--accent);font-weight:700}
  .bottomnav .ic{display:block;font-size:18px;margin-bottom:2px}
  .badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--danger);color:#fff;
       font-size:10px;border-radius:10px;padding:0 5px;line-height:15px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px}
  .cal-cell{border:1px solid var(--line);border-radius:6px;min-height:52px;padding:3px;background:#faf8f2}
  .cal-cell .dn{font-size:10px;color:var(--ink-dim)}
  .cal-cell .mk{font-size:10px;line-height:1.3;color:var(--accent);white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
  .habit-grid{display:grid;font-size:10.5px;overflow-x:auto}
  .habit-grid table{border-collapse:collapse;width:100%}
  .habit-grid th,.habit-grid td{border:1px solid var(--line);padding:3px 2px;text-align:center;min-width:20px}
  .habit-grid th{background:#faf8f2;font-weight:600;font-size:9.5px}
  .habit-grid td.name{text-align:left;padding-left:6px;white-space:nowrap;font-weight:600;min-width:90px}
  .habit-grid input[type=checkbox]{width:14px;height:14px}
  .habit-manage{font-size:12px;color:var(--accent);cursor:pointer;margin-top:8px;text-decoration:underline}
  .swipecard{margin:20px 14px;padding:20px 16px;border:1px solid var(--line);border-radius:16px;
       background:#faf8f2;text-align:center}
  .swipecard .from{font-size:11px;color:var(--ink-dim);margin-bottom:6px}
  .swipecard .txt{font-size:17px;font-weight:600;margin:10px 0 18px}
  .wizard-progress{font-size:11px;color:var(--ink-dim);text-align:center;padding-top:12px}
  .inbox-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0ece2}
  .inbox-row .txt{flex:1;font-size:14px}
  .inbox-row .from{font-size:11px;color:var(--ink-dim);display:block}
  .actions-reveal{display:flex;gap:6px}
  .quickadd{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .quickadd input{flex:1}
  .quickadd select{border-radius:9px;border:1px solid var(--line);font-size:13px}

  /* switcher */
  #switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;
       display:flex;align-items:center;gap:10px;background:#1c1a16;color:#fff;padding:8px 8px 8px 14px;
       border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px}
  #switcher button{background:#332f27;color:#fff;border:none;width:28px;height:28px;border-radius:50%;
       cursor:pointer;font-size:14px}
  #switcher .lbl{min-width:150px;text-align:center}
  #switcher .lbl b{display:block;font-size:9px;letter-spacing:.08em;color:#c9a97e;text-transform:uppercase}
</style>
</head>
<body>
<div class="note-banner">PROTOTYPE — throwaway, not production code. Answers "how should rapid logging /
migration / monthly log feel" for wayfinder ticket #8. In-memory data only, resets on reload.</div>
<div class="phone"><div id="app" class="screen"></div></div>
<div id="switcher"></div>

<script>
/* ---------- fixed "today" for a stable demo ---------- */
const TODAY = new Date(2026,7,22); // Aug 22 2026
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const TODAY_ISO = iso(TODAY);
const TODAY_MONTH = monthKey(TODAY);
const dayName = iso => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
const dayNum = iso => new Date(iso+'T00:00:00').getDate();
const humanDate = iso => new Date(iso+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const humanMonth = mk => { const [y,m]=mk.split('-'); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'}); };
const prevMonthKey = mk => { const [y,m]=mk.split('-').map(Number); const d=new Date(y,m-2,1); return monthKey(d); };
const nextMonthKey = mk => { const [y,m]=mk.split('-').map(Number); const d=new Date(y,m,1); return monthKey(d); };
const daysInMonth = mk => { const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); };

/* ---------- seed data ---------- */
let uid = 100;
const data = {
  habits: [
    {id:'h1', name:'Exercise', archived:false},
    {id:'h2', name:'Read 20 min', archived:false},
    {id:'h3', name:'No phone after 10pm', archived:false},
  ],
  monthlyHabitSelection: { '2026-07':['h1','h2'], '2026-08':['h1','h2','h3'] },
  habitChecks: {}, // key `${habitId}_${dateIso}` -> true
  bullets: [
    {id:'b1',type:'task',text:'Finish wayfinder prototype ticket',scope:'day',date:'2026-08-22',status:'open',history:[]},
    {id:'b2',type:'event',text:'Team standup 10am',scope:'day',date:'2026-08-22'},
    {id:'b3',type:'note',text:'Idea: weekly review ritual on Sundays',scope:'day',date:'2026-08-22'},
    {id:'b4',type:'task',text:'Buy groceries',scope:'day',date:'2026-08-20',status:'complete',history:[]},
    {id:'b5',type:'task',text:'Call dentist',scope:'day',date:'2026-08-20',status:'open',history:[]},
    {id:'b6',type:'task',text:'Renew passport',scope:'day',date:'2026-07-10',status:'open',history:[]},
    {id:'b7',type:'task',text:'Fix leaky faucet',scope:'day',date:'2026-07-18',status:'open',history:[]},
    {id:'b8',type:'task',text:'Write blog post draft',scope:'day',date:'2026-07-25',status:'open',
      history:[{from:'2026-06',to:'2026-07',timestamp:'2026-07-01T09:00:00Z'}]},
    {id:'b9',type:'event',text:"Mom's birthday",scope:'month',month:'2026-08',dayAnchor:'2026-08-28'},
    {id:'b10',type:'task',text:'Quarterly taxes due',scope:'month',month:'2026-08',dayAnchor:'2026-08-31',status:'open',history:[]},
    {id:'b11',type:'task',text:'Plan autumn trip',scope:'month',month:'2026-08',dayAnchor:null,status:'open',history:[]},
    {id:'b12',type:'task',text:'Research new laptop',scope:'month',month:'2026-08',dayAnchor:null,status:'open',history:[]},
    {id:'b13',type:'task',text:'Organize garage',scope:'month',month:'2026-07',dayAnchor:null,status:'open',history:[]},
  ],
};
// seed a few habit checks
['2026-08-18','2026-08-19','2026-08-20','2026-08-21'].forEach(d=>data.habitChecks[`h1_${d}`]=true);
['2026-08-19','2026-08-21'].forEach(d=>data.habitChecks[`h2_${d}`]=true);
['2026-08-20'].forEach(d=>data.habitChecks[`h3_${d}`]=true);

/* ---------- shared helpers ---------- */
function bulletsForDay(dateIso){
  return data.bullets.filter(b =>
    (b.scope==='day' && b.date===dateIso) ||
    (b.scope==='month' && b.dayAnchor===dateIso)
  ).sort((a,b)=> (a.scope==='month'?0:1) - (b.scope==='month'?0:1));
}
function monthAnchored(mk){ return data.bullets.filter(b=>b.scope==='month' && b.month===mk && b.dayAnchor); }
function monthUnanchored(mk){ return data.bullets.filter(b=>b.scope==='month' && b.month===mk && !b.dayAnchor); }
function openTasksForMonthBoundary(mk){
  return data.bullets.filter(b => b.type==='task' && b.status==='open' &&
    ((b.scope==='day' && b.date.startsWith(mk)) || (b.scope==='month' && b.month===mk)));
}
function glyph(b){
  if(b.type==='event') return '<span class="glyph event">○</span>';
  if(b.type==='note') return '<span class="glyph note">–</span>';
  if(b.status==='complete') return '<span class="glyph done">✕</span>';
  if(b.status==='cancelled') return '<span class="glyph cancel">⦸</span>';
  return '<span class="glyph">•</span>';
}
function bulletRow(b, opts={}){
  const txtClass = b.status==='complete' ? 'done' : b.status==='cancelled' ? 'cancel' : '';
  const tag = b.scope==='month' ? `<span class="tag">${b.dayAnchor ? 'this month' : 'month list'}</span>` : '';
  const toggler = (b.type==='task' && b.status==='open' && opts.dayCtx)
    ? `onclick="completeTask('${b.id}')" style="cursor:pointer"` : '';
  return `<div class="bullet-row" ${toggler}>${glyph(b)}<span class="btxt ${txtClass}">${b.text}${tag}</span></div>`;
}
function completeTask(id){
  const b = data.bullets.find(x=>x.id===id);
  if(b && b.status==='open'){ b.status='complete'; render(); }
}
function migrateTask(id, toMonth){
  const b = data.bullets.find(x=>x.id===id);
  const from = b.scope==='day' ? monthKey(new Date(b.date+'T00:00:00')) : b.month;
  b.history.push({from, to:toMonth, timestamp:new Date().toISOString()});
  b.scope='month'; b.month=toMonth; b.dayAnchor=null; // status stays open
  render();
}
function cancelTask(id){ const b=data.bullets.find(x=>x.id===id); b.status='cancelled'; render(); }
function completeTaskById(id){ const b=data.bullets.find(x=>x.id===id); b.status='complete'; render(); }
function toggleHabit(mk, habitId){
  const sel = data.monthlyHabitSelection[mk] || (data.monthlyHabitSelection[mk]=[]);
  const i = sel.indexOf(habitId);
  if(i>=0) sel.splice(i,1); else sel.push(habitId);
  render();
}
function toggleHabitCheck(habitId, dateIso){
  const k = `${habitId}_${dateIso}`;
  data.habitChecks[k] = !data.habitChecks[k];
  render();
}
function addBullet({type,text,scope,date,month,dayAnchor}){
  if(!text.trim()) return;
  uid++;
  data.bullets.push({
    id:'b'+uid, type, text:text.trim(), scope,
    date: scope==='day' ? date : undefined,
    month: scope==='month' ? month : undefined,
    dayAnchor: scope==='month' ? (dayAnchor||null) : undefined,
    status: type==='task' ? 'open' : undefined,
    history: type==='task' ? [] : undefined,
  });
  render();
}
function habitGridHTML(mk, editable){
  const sel = data.monthlyHabitSelection[mk] || [];
  const habits = data.habits.filter(h=>!h.archived && sel.includes(h.id));
  const nDays = daysInMonth(mk);
  const [y,m] = mk.split('-').map(Number);
  if(habits.length===0) return `<div class="empty">No habits selected for this month.</div>`;
  let head = '<tr><th>Habit</th>' + Array.from({length:nDays},(_,i)=>`<th>${i+1}</th>`).join('') + '</tr>';
  let rows = habits.map(h=>{
    let cells = Array.from({length:nDays},(_,i)=>{
      const d = `${y}-${pad(m)}-${pad(i+1)}`;
      const checked = !!data.habitChecks[`${h.id}_${d}`];
      return `<td><input type="checkbox" ${checked?'checked':''} onchange="toggleHabitCheck('${h.id}','${d}')"></td>`;
    }).join('');
    return `<tr><td class="name">${h.name}</td>${cells}</tr>`;
  }).join('');
  return `<div class="habit-grid"><table>${head}${rows}</table></div>
    ${editable ? habitPickerHTML(mk) : ''}`;
}
function habitPickerHTML(mk){
  const sel = data.monthlyHabitSelection[mk] || [];
  const chips = data.habits.filter(h=>!h.archived).map(h=>{
    const on = sel.includes(h.id);
    return `<button class="btn small ${on?'':'ghost'}" onclick="toggleHabit('${mk}','${h.id}')">${on?'✓ ':''}${h.name}</button>`;
  }).join(' ');
  return `<div class="row-gap" style="margin-top:8px">${chips}</div>`;
}

/* ---------- ui state ---------- */
const ui = { selectedDate: TODAY_ISO, activeMonth: TODAY_MONTH, tab:'today',
  sheetOpen:false, newBullet:{type:'task', dayAnchor:false},
  wizardIdx:0, monthlyTab:'calendar' };

/* ================= VARIANT A — Top tabs + modal migration review ================= */
function VariantA(){
  const migCandidates = openTasksForMonthBoundary(prevMonthKey(TODAY_MONTH));
  let body = '';
  if(ui.tab==='today'){
    body = `
      <div class="section">
        <h2>Daily Log — ${humanDate(ui.selectedDate)}</h2>
        ${bulletsForDay(ui.selectedDate).map(b=>bulletRow(b,{dayCtx:true})).join('') || '<div class="empty">Nothing logged yet.</div>'}
      </div>
      ${migCandidates.length ? `<div class="section">
        <button class="btn" onclick="openMigrationModal()">Review ${migCandidates.length} unfinished item${migCandidates.length>1?'s':''} from ${humanMonth(prevMonthKey(TODAY_MONTH))}</button>
      </div>` : ''}`;
  } else {
    const mk = ui.activeMonth;
    body = `
      <div class="section" style="padding-bottom:0">
        <div class="row-gap" style="justify-content:space-between;align-items:center">
          <button class="btn small ghost" onclick="ui.activeMonth=prevMonthKey(ui.activeMonth);render()">←</button>
          <b>${humanMonth(mk)}</b>
          <button class="btn small ghost" onclick="ui.activeMonth=nextMonthKey(ui.activeMonth);render()">→</button>
        </div>
        <div class="row-gap" style="margin:10px 0">
          ${['calendar','tasks','habits'].map(t=>`<button class="btn small ${ui.monthlyTab===t?'':'ghost'}" onclick="ui.monthlyTab='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}
        </div>
      </div>
      <div class="section" style="padding-top:0">
        ${ui.monthlyTab==='calendar' ? calendarGridHTML(mk) : ''}
        ${ui.monthlyTab==='tasks' ? (monthUnanchored(mk).map(b=>bulletRow(b)).join('') || '<div class="empty">No month-list items.</div>') : ''}
        ${ui.monthlyTab==='habits' ? habitGridHTML(mk, true) : ''}
      </div>`;
  }
  return `
    <header class="top"><h1 class="pagetitle">BuJo</h1><div class="sub">Variant A — Tabs &amp; modal review</div></header>
    <div class="tabbar">
      <button class="${ui.tab==='today'?'active':''}" onclick="ui.tab='today';render()">Today</button>
      <button class="${ui.tab==='month'?'active':''}" onclick="ui.tab='month';render()">Month</button>
    </div>
    ${body}
    <button class="fab" onclick="ui.sheetOpen='entry';render()">+</button>
    ${ui.sheetOpen==='entry' ? entrySheetHTML() : ''}
    ${ui.sheetOpen==='migration' ? migrationModalHTML(migCandidates) : ''}
  `;
}
function calendarGridHTML(mk){
  const nDays = daysInMonth(mk);
  const [y,m] = mk.split('-').map(Number);
  let cells = Array.from({length:nDays},(_,i)=>{
    const d = `${y}-${pad(m)}-${pad(i+1)}`;
    const items = bulletsForDay(d).filter(b=>b.scope==='month');
    return `<div class="cal-cell" onclick="ui.tab='today';ui.selectedDate='${d}';render()">
      <div class="dn">${i+1}</div>
      ${items.slice(0,2).map(b=>`<div class="mk">${glyph(b)}${b.text}</div>`).join('')}
    </div>`;
  }).join('');
  return `<div class="cal-grid">${cells}</div>`;
}
function openMigrationModal(){ ui.sheetOpen='migration'; render(); }
function migrationModalHTML(list){
  const to = TODAY_MONTH;
  return `<div class="sheet"><div class="card">
    <h2 style="margin-top:0">Review ${humanMonth(prevMonthKey(to))}</h2>
    ${list.map(b=>`
      <div class="bullet-row">
        ${glyph(b)}<span class="btxt">${b.text}</span>
      </div>
      <div class="row-gap" style="margin:0 0 10px 28px">
        <button class="btn small" onclick="migrateTask('${b.id}','${to}')">Migrate</button>
        <button class="btn small ok" onclick="completeTaskById('${b.id}')">Complete</button>
        <button class="btn small danger" onclick="cancelTask('${b.id}')">Cancel</button>
      </div>`).join('') || '<div class="empty">All clear!</div>'}
    <button class="btn ghost" onclick="closeSheet()" style="margin-top:6px">Close</button>
  </div></div>`;
}
function entrySheetHTML(){
  const b = ui.newBullet;
  return `<div class="sheet"><div class="card">
    <h2 style="margin-top:0">New bullet</h2>
    <div class="type-pick">
      ${['task','event','note'].map(t=>`<button class="${b.type===t?'active':''}" onclick="ui.newBullet.type='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
    <input type="text" id="entryText" placeholder="What's the bullet?" value="${b.text||''}">
    <div class="row-gap" style="margin-top:10px">
      <button class="btn" onclick="submitEntry('${ui.selectedDate}')">Add to ${humanDate(ui.selectedDate)}</button>
      <button class="btn ghost" onclick="closeSheet()">Cancel</button>
    </div>
  </div></div>`;
}
function submitEntry(dateIso){
  const text = document.getElementById('entryText').value;
  ui.sheetOpen=false;
  addBullet({type:ui.newBullet.type, text, scope:'day', date:dateIso});
}
function closeSheet(){ ui.sheetOpen=false; render(); }

/* ================= VARIANT B — Swipeable date strip + full-screen wizard migration ================= */
function VariantB(){
  const migCandidates = openTasksForMonthBoundary(prevMonthKey(TODAY_MONTH));
  if(ui.sheetOpen==='wizard') return migrationWizardHTML(migCandidates);
  if(ui.sheetOpen==='monthzoom') return monthZoomHTML();

  const d = new Date(ui.selectedDate+'T00:00:00');
  const strip = Array.from({length:7},(_,i)=>{
    const dd = new Date(d); dd.setDate(d.getDate()-3+i);
    const s = iso(dd);
    return `<div class="d ${s===ui.selectedDate?'active':''}" onclick="ui.selectedDate='${s}';render()">
      <div>${dayName(s)}</div><div class="n">${dayNum(s)}</div></div>`;
  }).join('');
  return `
    <header class="top"><h1 class="pagetitle">BuJo</h1><div class="sub">Variant B — Swipe strip &amp; wizard review</div></header>
    <div class="datestrip">${strip}</div>
    <div class="section">
      <h2>${humanDate(ui.selectedDate)}</h2>
      ${bulletsForDay(ui.selectedDate).map(b=>bulletRow(b,{dayCtx:true})).join('') || '<div class="empty">Nothing logged yet.</div>'}
    </div>
    <div class="section">
      <button class="btn ghost" onclick="ui.sheetOpen='monthzoom';render()">Zoom out to month view →</button>
      ${migCandidates.length ? `<div style="margin-top:8px"><button class="btn" onclick="ui.sheetOpen='wizard';ui.wizardIdx=0;render()">Start month-end review (${migCandidates.length})</button></div>` : ''}
    </div>
    <div class="quickadd">
      <select id="qaType"><option value="task">•</option><option value="event">○</option><option value="note">–</option></select>
      <input type="text" id="qaText" placeholder="Quick add to ${humanDate(ui.selectedDate)}...">
      <button class="btn small" onclick="quickAdd()">Add</button>
    </div>
  `;
}
function quickAdd(){
  const type = document.getElementById('qaType').value;
  const text = document.getElementById('qaText').value;
  addBullet({type, text, scope:'day', date:ui.selectedDate});
}
function monthZoomHTML(){
  const mk = ui.activeMonth;
  return `
    <header class="top"><h1 class="pagetitle">${humanMonth(mk)}</h1><div class="sub">Variant B — Month zoom-out</div></header>
    <div class="section" style="padding-bottom:0">
      <div class="row-gap" style="justify-content:space-between">
        <button class="btn small ghost" onclick="ui.activeMonth=prevMonthKey(ui.activeMonth);render()">← Prev</button>
        <button class="btn small ghost" onclick="closeSheet()">Back to day ↩</button>
        <button class="btn small ghost" onclick="ui.activeMonth=nextMonthKey(ui.activeMonth);render()">Next →</button>
      </div>
    </div>
    <div class="section"><h2>Calendar</h2>${calendarGridHTML(mk)}</div>
    <div class="section"><h2>Month task list</h2>
      ${monthUnanchored(mk).map(b=>bulletRow(b)).join('') || '<div class="empty">No month-list items.</div>'}
    </div>
    <div class="section"><h2>Habits</h2>${habitGridHTML(mk, true)}</div>
  `;
}
function migrationWizardHTML(list){
  const remaining = list.filter(b=>b.status==='open');
  if(remaining.length===0){
    return `<header class="top"><h1 class="pagetitle">Review complete</h1></header>
      <div class="section">Nice — everything from ${humanMonth(prevMonthKey(TODAY_MONTH))} is sorted.</div>
      <div class="section"><button class="btn" onclick="closeSheet()">Back to today</button></div>`;
  }
  const idx = Math.min(ui.wizardIdx, remaining.length-1);
  const b = remaining[idx];
  const from = b.scope==='day' ? b.date : b.month;
  return `
    <header class="top"><h1 class="pagetitle">Month-end review</h1><div class="sub">Variant B — swipe-card wizard</div></header>
    <div class="wizard-progress">${idx+1} of ${remaining.length}</div>
    <div class="swipecard">
      <div class="from">from ${from}${b.history && b.history.length ? ` · migrated ${b.history.length}x before` : ''}</div>
      <div class="txt">${b.text}</div>
      <div class="row-gap" style="justify-content:center">
        <button class="btn small" onclick="wizardAct('${b.id}','migrate')">→ Migrate</button>
        <button class="btn small ok" onclick="wizardAct('${b.id}','complete')">↑ Complete</button>
        <button class="btn small danger" onclick="wizardAct('${b.id}','cancel')">← Cancel</button>
      </div>
    </div>
  `;
}
function wizardAct(id, action){
  if(action==='migrate') migrateTask(id, TODAY_MONTH);
  if(action==='complete') completeTaskById(id);
  if(action==='cancel') cancelTask(id);
}

/* ================= VARIANT C — Bottom-nav app shell + inbox-style migration ================= */
function VariantC(){
  const migCandidates = openTasksForMonthBoundary(prevMonthKey(TODAY_MONTH)).filter(b=>b.status==='open');
  let body='';
  if(ui.tab==='today'){
    body = `
      <header class="top">
        <div class="row-gap" style="justify-content:space-between;align-items:center">
          <div><h1 class="pagetitle">${humanDate(ui.selectedDate)}</h1><div class="sub">Today</div></div>
          <button class="btn small" onclick="ui.sheetOpen='entry';render()">+ Add</button>
        </div>
      </header>
      <div class="section">
        ${bulletsForDay(ui.selectedDate).map(b=>bulletRow(b,{dayCtx:true})).join('') || '<div class="empty">Nothing logged yet.</div>'}
      </div>`;
  } else if(ui.tab==='month'){
    const mk = ui.activeMonth;
    body = `
      <header class="top">
        <div class="row-gap" style="justify-content:space-between;align-items:center">
          <button class="btn small ghost" onclick="ui.activeMonth=prevMonthKey(ui.activeMonth);render()">←</button>
          <b>${humanMonth(mk)}</b>
          <button class="btn small ghost" onclick="ui.activeMonth=nextMonthKey(ui.activeMonth);render()">→</button>
        </div>
      </header>
      <div class="section"><h2>Calendar</h2>${calendarGridHTML(mk)}</div>
      <div class="section"><h2>Task list</h2>
        ${monthUnanchored(mk).map(b=>bulletRow(b)).join('') || '<div class="empty">No month-list items.</div>'}
      </div>`;
  } else if(ui.tab==='habits'){
    body = `
      <header class="top"><h1 class="pagetitle">Habits</h1><div class="sub">${humanMonth(ui.activeMonth)}</div></header>
      <div class="section">${habitGridHTML(ui.activeMonth, true)}</div>`;
  } else if(ui.tab==='review'){
    body = `
      <header class="top"><h1 class="pagetitle">Review inbox</h1><div class="sub">Unfinished from ${humanMonth(prevMonthKey(TODAY_MONTH))}</div></header>
      ${migCandidates.map(b=>{
        const from = b.scope==='day' ? b.date : b.month;
        return `<div class="inbox-row">
          <div>${glyph(b)}<span class="txt">${b.text}</span><span class="from">from ${from}</span></div>
          <div class="actions-reveal">
            <button class="btn small" onclick="migrateTask('${b.id}','${TODAY_MONTH}')">Migrate</button>
            <button class="btn small ok" onclick="completeTaskById('${b.id}')">✓</button>
            <button class="btn small danger" onclick="cancelTask('${b.id}')">✕</button>
          </div>
        </div>`;
      }).join('') || '<div class="section"><div class="empty">Inbox zero — nothing to review.</div></div>'}`;
  }
  return `
    ${body}
    ${ui.sheetOpen==='entry' ? entrySheetHTML() : ''}
    <div class="bottomnav">
      <button class="${ui.tab==='today'?'active':''}" onclick="ui.tab='today';render()"><span class="ic">☀</span>Today</button>
      <button class="${ui.tab==='month'?'active':''}" onclick="ui.tab='month';render()"><span class="ic">▤</span>Month</button>
      <button class="${ui.tab==='habits'?'active':''}" onclick="ui.tab='habits';render()"><span class="ic">◎</span>Habits</button>
      <button class="${ui.tab==='review'?'active':''}" onclick="ui.tab='review';render()" style="position:relative">
        <span class="ic">✎</span>Review
        ${migCandidates.length ? `<span class="badge">${migCandidates.length}</span>` : ''}
      </button>
    </div>
  `;
}

/* ---------- switcher / router ---------- */
const VARIANTS = {
  A: {fn:VariantA, name:'Tabs & modal review'},
  B: {fn:VariantB, name:'Swipe strip & wizard'},
  C: {fn:VariantC, name:'Bottom-nav & inbox'},
};
const ORDER = ['A','B','C'];
function currentVariant(){
  const v = new URLSearchParams(location.search).get('variant');
  return VARIANTS[v] ? v : 'A';
}
function setVariant(v){
  const url = new URL(location.href);
  url.searchParams.set('variant', v);
  history.replaceState(null,'',url);
  ui.sheetOpen=false; ui.tab='today'; ui.wizardIdx=0;
  render();
}
function cycle(dir){
  const cur = currentVariant();
  const i = ORDER.indexOf(cur);
  setVariant(ORDER[(i+dir+ORDER.length)%ORDER.length]);
}
function renderSwitcher(){
  const cur = currentVariant();
  document.getElementById('switcher').innerHTML = `
    <button onclick="cycle(-1)">←</button>
    <span class="lbl"><b>Variant</b>${cur} — ${VARIANTS[cur].name}</span>
    <button onclick="cycle(1)">→</button>
  `;
}
document.addEventListener('keydown', e=>{
  const tag = (document.activeElement||{}).tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
function render(){
  const v = currentVariant();
  document.getElementById('app').innerHTML = VARIANTS[v].fn();
  renderSwitcher();
}
render();
</script>
</body>
